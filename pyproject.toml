[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-calculator"
version = "1.0.0"
description = "Мини-калькулятор на Python: ядро вычислений + интерфейс tkinter и CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mini Calculator contributors" }]
keywords = ["calculator", "tkinter", "cli", "decimal"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
calc = "calculator.cli:main"
calc-gui = "calculator.gui:run"

[tool.setuptools]
packages = ["calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
